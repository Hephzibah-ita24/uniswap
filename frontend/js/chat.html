<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniswap - Chat</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #chatBox { height: 350px; overflow-y: auto; border: 1px solid #ccc; border-radius: 6px; padding: 12px; background: white; margin-bottom: 12px; }
    .message { margin-bottom: 8px; padding: 8px 12px; border-radius: 6px; max-width: 75%; }
    .message.sent { background: #d1e7dd; margin-left: auto; text-align: right; }
    .message.received { background: #f8d7da; margin-right: auto; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <a class="logo" href="browse.html">Uniswap</a>
    <div>
      <a href="browse.html">Browse</a>
      <a href="create-listing.html">Sell</a>
      <a href="inbox.html">Messages</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </div>

  <!-- Main Container -->
  <div class="container" style="max-width: 600px; margin-top: 20px;">
    <h2>Chat</h2>
    <p class="error" id="error"></p>
    <div id="chatBox">Loading messages...</div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="messageInput" placeholder="Type a message..." style="flex: 1;">
      <button class="btn" id="sendBtn" style="width: 100px; margin-top: 0;">Send</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    requireLogin();
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    const params = new URLSearchParams(window.location.search);
    const sellerId = params.get("sellerId");
    const listingId = params.get("listingId");
    const chatId = params.get("chatId");

    async function loadMessages() {
      const chatBox = document.getElementById("chatBox");
      try {
        const endpoint = chatId ? `/chats/${chatId}/messages` : `/chats/messages?sellerId=${sellerId}&listingId=${listingId}`;
        const messages = await apiFetch(endpoint).catch(() => []);
        
        if (!messages || messages.length === 0) {
          chatBox.innerHTML = "<p style='color: #666; text-align: center;'>No messages yet. Say hello!</p>";
          return;
        }

        chatBox.innerHTML = "";
        messages.forEach(m => {
          const div = document.createElement("div");
          div.className = `message ${m.isSender ? 'sent' : 'received'}`;
          div.innerHTML = `<strong>${escapeHtml(m.senderName)}:</strong> ${escapeHtml(m.content)}`;
          chatBox.appendChild(div);
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (e) {
        console.error("Error polling messages:", e);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const content = input.value.trim();
      if (!content) return;

      try {
        await apiFetch("/chats/messages", {
          method: "POST",
          body: JSON.stringify({ recipientId: sellerId, listingId: Number(listingId), content })
        });
        input.value = "";
        loadMessages();
      } catch (e) {
        document.getElementById("error").textContent = "Failed to send message: " + e.message;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadMessages();
    // Poll messages every 3 seconds for real-time chat updates
    setInterval(loadMessages, 3000);
  </script>
</body>
</html>
