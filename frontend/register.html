<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniswap - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar"><a class="logo" href="index.html">Uniswap</a></div>

  <div class="form-box">
    <h2>Create account</h2>
    <label>Full name</label>
    <input type="text" id="name">
    <label>Email</label>
    <input type="email" id="email">
    <label>Password</label>
    <input type="password" id="password">
    <label for="studentId">Student ID</label>
    <input type="text" id="studentId" required>
    <label>Faculty</label>
    <select id="faculty">
      <option value="">Loading faculties...</option>
    </select>
    <button class="btn" id="registerBtn">Register</button>
    <p class="error" id="error"></p>
    <p style="margin-top:14px;text-align:center;">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Fill the faculty dropdown from the backend
    async function loadFaculties() {
      const select = document.getElementById("faculty");
      try {
        const faculties = await apiFetch("/faculties");
        select.innerHTML = '<option value="">Select your faculty</option>';
        faculties.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f.id;
          opt.textContent = f.name;
          select.appendChild(opt);
        });
      } catch (e) {
        select.innerHTML = '<option value="">Could not load faculties</option>';
      }
    }
    loadFaculties();

    document.getElementById("registerBtn").addEventListener("click", async () => {
      const fullName = document.getElementById("name").value.trim();
      const studentId = document.getElementById("studentId").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const facultyId = document.getElementById("faculty").value;
      const errorBox = document.getElementById("error");

      if (!fullName || !studentId || !email || !password || !facultyId) {
        errorBox.textContent = "Please fill in all fields.";
        return;
      }
      if (password.length < 8) {
        errorBox.textContent = "Password must be at least 8 characters.";
        return;
      }

      try {
        await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify({ studentId, fullName, email, password, facultyId: Number(facultyId) })
        });
        window.location.href = "login.html";
      } catch (e) {
        errorBox.textContent = e.message;
      }
    });
  </script>
</body>
</html>
