<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Upload test</title>

</head>

<body>

<input type="file" id="file" accept="image/*">

<button id="btn">Upload</button>

<p id="out"></p>

<img id="preview" style="max-width:300px">



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://labntnnhhqhifdpyrtyi.supabase.co";

const SUPABASE_KEY = "sb_publishable_ViRAP5QY8BFFiPH_SkXglw_sfS4ck8A";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);



document.getElementById("btn").onclick = async () => {

const file = document.getElementById("file").files[0];

if (!file) return;

const ext = file.name.split(".").pop();

const path = Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext;



const { error } = await client.storage

.from("item-photos")

.upload(path, file, { contentType: file.type });

if (error) {

document.getElementById("out").textContent = "Upload failed: " + error.message;

return;

}

const { data } = client.storage.from("item-photos").getPublicUrl(path);

document.getElementById("out").textContent = data.publicUrl;

document.getElementById("preview").src = data.publicUrl;

};

</script>

</body>

</html>
