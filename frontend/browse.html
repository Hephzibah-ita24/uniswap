<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniswap - Browse</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px;
             background:#e8eaf6; color:#2d3a8c; margin:2px 4px 2px 0; }
    .thumb { width:100%; height:150px; object-fit:cover; border-radius:6px; margin-bottom:8px; background:#eee; }
    .noimg { width:100%; height:150px; border-radius:6px; margin-bottom:8px; background:#eee;
             display:flex; align-items:center; justify-content:center; color:#999; font-size:13px; }
    .price { color:#2d3a8c; font-weight:bold; margin:4px 0; }
  </style>
</head>
<body>
  <div id="navbar"></div>
    <div class="hero">
    <h1>Buy and sell on campus</h1>
    <p>Textbooks, clothes and electronics from students at your university</p>
  </div>

  <div class="container">
    <div class="search-row">
      <input type="text" id="search" placeholder="Search textbooks, clothes, electronics...">
    </div>

    <div class="chips" id="chips"></div>

    <div class="filters">
      <div>
        <label for="facultyFilter">Faculty</label>
        <select id="facultyFilter"><option value="">All faculties</option></select>
      </div>
      <div>
        <label for="minPrice">Min price</label>
        <input type="number" id="minPrice" min="0" placeholder="0">
      </div>
      <div>
        <label for="maxPrice">Max price</label>
        <input type="number" id="maxPrice" min="0" placeholder="Any">
      </div>
      <div>
        <label for="conditionFilter">Condition</label>
        <select id="conditionFilter">
          <option value="">Any</option>
          <option value="NEW">New</option>
          <option value="GOOD">Good</option>
          <option value="USED">Used</option>
        </select>
      </div>
      <div>
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="newest">Newest</option>
          <option value="priceAsc">Price: low to high</option>
          <option value="priceDesc">Price: high to low</option>
        </select>
      </div>
      <button class="btn-light" id="resetBtn">Reset</button>
    </div>

    <p class="error" id="error"></p>
    <p class="result-count" id="count"></p>
    <div class="grid" id="listings"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    requireLogin();

    let allListings = [];
    let activeCategory = "";

    function facultyOf(l) { return l.facultyName || (l.faculty && l.faculty.name) || ""; }
    function facultyIdOf(l) { return l.facultyId ?? (l.faculty && l.faculty.id); }
    function categoryOf(l) { return l.categoryName || (l.category && l.category.name) || ""; }
    function conditionOf(l) { return l.itemCondition || l.condition || ""; }

    async function loadFaculties() {
      try {
        const faculties = await apiFetch("/faculties");
        const select = document.getElementById("facultyFilter");
        faculties.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f.id;
          opt.textContent = f.name;
          select.appendChild(opt);
        });
      } catch (e) { /* filter stays on "All faculties" */ }
    }

    async function loadCategories() {
      const box = document.getElementById("chips");
      let names = [];
      try {
        const cats = await apiFetch("/categories");
        names = cats.map(c => c.name);
      } catch (e) { /* only the All chip */ }
      box.innerHTML = "";
      ["All", ...names].forEach(name => {
        const b = document.createElement("button");
        b.className = "chip" + (name === "All" ? " active" : "");
        b.textContent = name;
        b.addEventListener("click", () => {
          activeCategory = name === "All" ? "" : name;
          box.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
          b.classList.add("active");
          render();
        });
        box.appendChild(b);
      });
    }

    async function loadListings() {
      const grid = document.getElementById("listings");
      grid.innerHTML = "Loading...";
      try {
        allListings = await apiFetch("/listings");
        render();
      } catch (e) {
        grid.innerHTML = "";
        document.getElementById("error").textContent = e.message;
      }
    }

    function render() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const facSel = document.getElementById("facultyFilter");
      const facVal = facSel.value;
      const facText = facVal ? facSel.options[facSel.selectedIndex].textContent : "";
      const minP = parseFloat(document.getElementById("minPrice").value);
      const maxP = parseFloat(document.getElementById("maxPrice").value);
      const cond = document.getElementById("conditionFilter").value;
      const sort = document.getElementById("sortBy").value;

      let list = allListings.filter(l => {
        const price = Number(l.price);
        if (q) {
          const hay = `${l.title} ${l.description || ""} ${categoryOf(l)} ${facultyOf(l)}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        if (activeCategory && categoryOf(l) !== activeCategory) return false;
        if (facVal) {
          const fid = facultyIdOf(l);
          const matches = fid != null ? String(fid) === facVal : facultyOf(l) === facText;
          if (!matches) return false;
        }
        if (!isNaN(minP) && price < minP) return false;
        if (!isNaN(maxP) && price > maxP) return false;
        if (cond && conditionOf(l) !== cond) return false;
        return true;
      });

      if (sort === "priceAsc") list.sort((a, b) => Number(a.price) - Number(b.price));
      else if (sort === "priceDesc") list.sort((a, b) => Number(b.price) - Number(a.price));
      else list.sort((a, b) => (b.createdAt ? String(b.createdAt).localeCompare(String(a.createdAt)) : b.id - a.id));

      const grid = document.getElementById("listings");
      document.getElementById("count").textContent =
        list.length + (list.length === 1 ? " item found" : " items found");
      grid.innerHTML = list.length ? "" : "<p>No items match your search. Try changing the filters.</p>";

      list.forEach(l => {
        const card = document.createElement("div");
        card.className = "card";
        card.style.cursor = "pointer";
        const imgs = listingImages(l);
        const picture = imgs.length
          ? `<img class="thumb" src="${imgs[0]}" alt="">`
          : `<div class="noimg">No photo</div>`;
        const c = conditionOf(l), f = facultyOf(l), cat = categoryOf(l);
        card.innerHTML = `
          ${picture}
          <h3>${escapeHtml(l.title)}</h3>
          <p class="price">${formatPrice(l.price)}</p>
          <div>
            ${c ? `<span class="badge">${conditionLabel(c)}</span>` : ""}
            ${f ? `<span class="badge">${escapeHtml(f)}</span>` : ""}
            ${cat ? `<span class="badge">${escapeHtml(cat)}</span>` : ""}
          </div>`;
        card.addEventListener("click", () => { window.location.href = `listing.html?id=${l.id}`; });
        grid.appendChild(card);
      });
    }

    ["search", "minPrice", "maxPrice"].forEach(id =>
      document.getElementById(id).addEventListener("input", render));
    ["facultyFilter", "conditionFilter", "sortBy"].forEach(id =>
      document.getElementById(id).addEventListener("change", render));

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("search").value = "";
      document.getElementById("minPrice").value = "";
      document.getElementById("maxPrice").value = "";
      document.getElementById("facultyFilter").value = "";
      document.getElementById("conditionFilter").value = "";
      document.getElementById("sortBy").value = "newest";
      activeCategory = "";
      document.querySelectorAll(".chip").forEach((c, i) => c.classList.toggle("active", i === 0));
      render();
    });

    loadFaculties();
    loadCategories();
    loadListings();
  </script>
</body>
</html>
