<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniswap - Browse</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px;
             background:#e8eaf6; color:#2d3a8c; margin:2px 4px 2px 0; }
    .thumb { width:100%; height:150px; object-fit:cover; border-radius:6px; margin-bottom:8px; background:#eee; }
    .noimg { width:100%; height:150px; border-radius:6px; margin-bottom:8px; background:#eee;
             display:flex; align-items:center; justify-content:center; color:#999; font-size:13px; }
    .price { color:#2d3a8c; font-weight:bold; margin:4px 0; }
  </style>
</head>
<body>
  <div class="navbar">
    <a class="logo" href="browse.html">Uniswap</a>
    <div>
      <a href="browse.html">Browse</a>
      <a href="create-listing.html">Sell</a>
      <a href="inbox.html">Chats</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </div>

  <div class="container">
    <label for="facultyFilter">Filter by faculty</label>
    <select id="facultyFilter"><option value="">All faculties</option></select>
    <p class="error" id="error"></p>
    <div class="grid" id="listings" style="margin-top:16px;"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    requireLogin();
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    async function loadFaculties() {
      try {
        const faculties = await apiFetch("/faculties");
        const select = document.getElementById("facultyFilter");
        faculties.forEach(f => {
          const opt = document.createElement("option");
          opt.value = f.id;
          opt.textContent = f.name;
          select.appendChild(opt);
        });
      } catch (e) {
        document.getElementById("error").textContent = e.message;
      }
    }

    async function loadListings() {
      const faculty = document.getElementById("facultyFilter").value;
      const grid = document.getElementById("listings");
      grid.innerHTML = "Loading...";
      try {
        const listings = await apiFetch("/listings" + (faculty ? "?faculty=" + faculty : ""));
        grid.innerHTML = listings.length ? "" : "No listings in this faculty yet.";
        listings.forEach(l => {
          const card = document.createElement("div");
          card.className = "card";
          card.style.cursor = "pointer";

          const imgs = listingImages(l);
          const picture = imgs.length
            ? `<img class="thumb" src="${imgs[0]}" alt="">`
            : `<div class="noimg">No photo</div>`;

          const condition = l.itemCondition || l.condition;
          const facultyName = l.facultyName || (l.faculty && l.faculty.name);
          const categoryName = l.categoryName || (l.category && l.category.name);

          card.innerHTML = `
            ${picture}
            <h3>${escapeHtml(l.title)}</h3>
            <p class="price">${formatPrice(l.price)}</p>
            <div>
              ${condition ? `<span class="badge">${conditionLabel(condition)}</span>` : ""}
              ${facultyName ? `<span class="badge">${escapeHtml(facultyName)}</span>` : ""}
              ${categoryName ? `<span class="badge">${escapeHtml(categoryName)}</span>` : ""}
            </div>`;
          card.addEventListener("click", () => {
            window.location.href = `listing.html?id=${l.id}`;
          });
          grid.appendChild(card);
        });
      } catch (e) {
        grid.innerHTML = "";
        document.getElementById("error").textContent = e.message;
      }
    }

    document.getElementById("facultyFilter").addEventListener("change", loadListings);
    loadFaculties();
    loadListings();
  </script>
</body>
</html>
