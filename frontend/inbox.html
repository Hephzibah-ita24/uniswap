<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniswap - Inbox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="navbar">
    <a class="logo" href="browse.html">Uniswap</a>
    <div>
      <a href="browse.html">Browse</a>
      <a href="create-listing.html">Sell</a>
      <a href="inbox.html">Chats</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </div>

  <div class="container" style="max-width: 600px; margin-top: 30px;">
    <h2>Your Conversations</h2>
    <p class="error" id="error"></p>
    <div id="conversationsList" style="margin-top: 16px;">
      <p>Loading conversations...</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    requireLogin();
    document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logout(); });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function loadConversations() {
      const listEl = document.getElementById("conversationsList");
      try {
        const convs = await apiFetch("/conversations");
        if (!convs || convs.length === 0) {
          listEl.innerHTML = "<p>No messages yet.</p>";
          return;
        }
        listEl.innerHTML = "";
        convs.forEach(c => {
          const item = document.createElement("div");
          item.className = "card";
          item.style.marginBottom = "10px";
          item.style.cursor = "pointer";
          item.innerHTML = `
            <h4 style="margin-bottom: 4px;">${escapeHtml(c.listingTitle || "Listing")}</h4>
            <p style="font-size: 14px; color: #666;">Buyer: ${escapeHtml(c.buyerName)} · Seller: ${escapeHtml(c.sellerName)}</p>
          `;
          item.addEventListener("click", () => {
            window.location.href = `chat.html?id=${c.id}`;
          });
          listEl.appendChild(item);
        });
      } catch (e) {
        listEl.innerHTML = `<p class="error">Failed to load conversations: ${e.message}</p>`;
      }
    }

    loadConversations();
  </script>
</body>
</html>
